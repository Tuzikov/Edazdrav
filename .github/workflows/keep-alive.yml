name: Supabase keep-alive

on:
  schedule:
    # Каждые 6 часов. Раньше пинговали 2 раза в неделю (пн/чт) — формально
    # укладывалось в заявленный 7-дневный порог бездействия, но проект всё
    # равно засыпал через 3 дня после последнего успешного пинга (см. историю
    # запусков 2026-09-14 → 2026-09-17). В документации Supabase порог описан
    # расплывчато ("обычно достаточно нескольких запросов к БД в день на
    # протяжении недели") — похоже, их реальная эвристика активности жёстче
    # буквальных "7 дней" и ждёт активность каждый день, а не пару раз в
    # неделю. Если и это не поможет — считать бесплатный тариф ненадёжным
    # против паузы и переходить на Pro (там паузы по неактивности вообще нет).
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query keep_alive table
        run: |
          curl --fail --silent --show-error \
            "https://iwqabjqsrqvmqciikzqn.supabase.co/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: sb_publishable_Y7eTtlq2SM0yk8kmzYPCyw_ttB4KuBE" \
            -H "Authorization: Bearer sb_publishable_Y7eTtlq2SM0yk8kmzYPCyw_ttB4KuBE"
